version: 1.0.0
# Devices Configuration
devices:

  # PCA9554A I/O expander — must initialize before display_lcd.
  # Bit map sourced from Adafruit's arduino-esp32 variant pins_arduino.h.
  # Driver: esp_io_expander_tca9554 (PCA9554A is register-compatible per
  # espressif/esp-bsp#335). I2C address 0x3F (7-bit).
  # Output idle state and panel reset pulse handled by io_expander_factory_entry_t()
  # in setup_device.c.
  - name: gpio_expander
    chip: pca9554a
    type: gpio_expander
    version: default
    dependencies:
      espressif/esp_io_expander_tca9554: "*"
    config:
      max_pins: 8
      # Authoritative bit map per Adafruit pins_arduino.h:
      #   bit 0 = TFT_SCK        (output)
      #   bit 1 = TFT_CS         (output, idle high)
      #   bit 2 = TFT_RESET      (output)
      #   bit 3 = TOUCH_IRQ      (input)
      #   bit 4 = TFT_BACKLIGHT  (output, must be HIGH to enable backlight)
      #   bit 5 = BUTTON_UP      (input)
      #   bit 6 = BUTTON_DOWN    (input)
      #   bit 7 = TFT_MOSI       (output)
      output_io_mask: [0, 1, 2, 4, 7]
      # Initial levels (in order of output_io_mask above):
      #   CLK(0)=0, CS(1)=1 idle, RESET(2)=0 panel held in reset,
      #   BL(4)=1 backlight ON, MOSI(7)=0
      output_io_level_mask: [0, 1, 0, 1, 0]
      input_io_mask: [3, 5, 6]
    peripherals:
      - name: i2c_master
        i2c_addr: [0x3F]
  - name: display_lcd
    chip: tl021wvc02ct
    type: custom
    version: default
    config:
      pclk_hz: 16000000          # within panel's 10-30 MHz range; typ 17 MHz
      h_res: 480
      v_res: 480
      hsync_pulse_width: 20   # CircuitPython authoritative
      hsync_front_porch: 40   # CircuitPython authoritative
      hsync_back_porch: 40    # CircuitPython authoritative
      vsync_pulse_width: 10   # CircuitPython authoritative
      vsync_front_porch: 40   # CircuitPython authoritative
      vsync_back_porch: 40    # CircuitPython authoritative
      hsync_idle_low: false
      vsync_idle_low: false
      de_idle_high: false
      pclk_active_neg: false
      pclk_idle_high: false
      data_gpio_r0: 11
      data_gpio_r1: 10
      data_gpio_r2: 9
      data_gpio_r3: 46
      data_gpio_r4: 3
      data_gpio_g0: 48
      data_gpio_g1: 47
      data_gpio_g2: 21
      data_gpio_g3: 14
      data_gpio_g4: 13
      data_gpio_g5: 12
      data_gpio_b0: 40
      data_gpio_b1: 39
      data_gpio_b2: 38
      data_gpio_b3: 0
      data_gpio_b4: 45
      de_gpio_num: 2
      vsync_gpio_num: 42
      hsync_gpio_num: 41
      pclk_gpio_num: 1
      bits_per_pixel: 16
    peripherals:
      - name: i2c_master

  # Capacitive touch — CST826 at I2C 0x15 on the shared bus.
  # Driver: esp_lcd_touch_cst816s (CST826 is same family, register-compatible).
  # Touch INT and RESET pins are connector-side and driven by the panel itself
  # via the 40-pin FPC; not directly accessible from S3 GPIOs on the Qualia
  # carrier, so we use -1 (chip self-resets via panel power and only signals
  # via I2C polling).
  - name: lcd_touch
    chip: cst826
    type: lcd_touch_i2c
    version: default
    dependencies:
      espressif/esp_lcd_touch_cst816s: "*"
    config:
      io_i2c_config:
        dev_addr: [0x15]
        peripherals:
          - name: i2c_master
      touch_config:
        x_max: 480
        y_max: 480
        int_gpio_num: -1
        rst_gpio_num: -1
        flags:
          swap_xy: false
          mirror_x: false
          mirror_y: false
